<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shithead — Private Lobby</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#121d22;color:#fafafa}
body{margin:0;max-width:680px;padding:24px 20px 70px;margin-inline:auto}
h1{font-size:2rem;margin-bottom:8px}p{color:#bbc9ca;line-height:1.55}
.panel{background:#1e3035;padding:18px;border-radius:14px;margin:15px 0}
input,button,select{font:inherit;padding:12px;border-radius:9px;border:1px solid #608083}
input,select{background:#142329;color:#fff;max-width:100%;box-sizing:border-box}
button{background:#f38a3e;border:0;color:#151718;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#players li{margin:10px 0}#status{min-height:24px;color:#e7a36c}
small{color:#b5c2c4}
</style>
</head>
<body>
<h1>Shithead <small>Multiplayer preview</small></h1>
<p>Create a private room, share its code and password with friends, then play online.</p>
<div class="panel">
<h2>Create a room</h2>
<div class="row"><label>Players <select id="capacity"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><input id="create-password" type="text" minlength="4" maxlength="128" placeholder="Room password (optional)" aria-label="Create room password"><button id="create">Create room</button></div>
<p id="invite" hidden></p>
</div>
<div class="panel">
<h2>Join a room</h2>
<div class="row"><input id="room" placeholder="Room code" aria-label="Room code"><input id="name" placeholder="Your name" maxlength="32" aria-label="Your name"><input id="join-password" type="password" minlength="4" maxlength="128" placeholder="Room password" aria-label="Room password"><button id="join">Join</button></div>
</div>
<div class="panel" id="lobby" hidden>
<h2>Lobby <small id="room-label"></small></h2>
<ul id="players"></ul>
<div class="row"><button id="ready" disabled>Ready</button><small id="phase"></small></div>
<p><small>Invite friends using the room code and room password. Your seat stays reserved if you disconnect.</small></p>
</div>
<div class="panel" id="game-panel" hidden>
<h2>Table <small id="turn-label"></small></h2>
<p id="pile-label"></p>
<div id="player-counts"></div>
<h3>Your cards</h3>
<div id="my-cards" class="row"></div>
<p id="action-hint"></p>
<div class="row">
<label>Target <select id="target"></select></label>
<button id="play-card" type="button">Play selected</button>
<button id="use-power" type="button">3 / Joker</button>
<button id="flip-card" type="button">Flip</button>
<button id="pickup" type="button">Pick up</button>
<button id="counter" type="button">Counter</button>
<button id="accept" type="button">Accept pile</button>
</div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script defer src="/client.js"></script></body></html>

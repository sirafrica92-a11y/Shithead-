name: Android preview APK (test only)
on:
  push:
    branches:
      - feature/android-preview-test-kit-20261031
    paths:
      - 'android/**'
      - '.github/workflows/android-preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    if: github.repository == 'sirafrica92-a11y/Shithead-'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the test branch
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu hosted runners already provide Android cmdline tools. Avoid the
      # setup-android@v3 'sdkmanager tools' legacy package (removed upstream).
      - name: Use preinstalled Android SDK manager and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager missing at ${SDKMANAGER}"
            exit 1
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" --licenses < <(yes) > /dev/null
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build test-only DEBUG APK
        run: gradle --project-dir android/test-shell :app:assembleDebug --no-daemon
      - name: Verify APK archive exists
        shell: bash
        run: |
          set -euo pipefail
          APK=android/test-shell/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          sha256sum "$APK"
      - name: Attach temporary APK for owner phone testing
        uses: actions/upload-artifact@v4
        with:
          name: sh-games-preview-debug-apk-NOT-FOR-PLAY
          path: android/test-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

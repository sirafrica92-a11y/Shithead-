name: Shithead Python tests
on:
  push:
    branches:
      - fix/w3-test-contract-20261018
      - feature/w4-local-multiplayer-lobby-20261018
      - feature/w4-live-card-matches-20261018
  pull_request:
    branches:
      - build/w1-turn-seat-selector
      - fix/w3-test-contract-20261018
      - feature/w4-local-multiplayer-lobby-20261018
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest fastapi httpx uvicorn
      - run: python -m pytest -q server/tests

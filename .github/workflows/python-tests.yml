name: Shithead Python tests
on:
  push:
    branches:
      - feature/solo-play-awale-20261031
      - feature/solo-play-ludo-20261031
      - feature/google-owner-login-only-20261031
      - release/owner-analytics-capacity-home-20261031
      - feature/capacity-communication-analytics-20261031
      - feature/owner-analytics-dashboard-20261031
      - feature/jamaican-cutthroat-option-game06-20261030
      - feature/jamaican-partner-dominoes-game06-20261030
      - feature/yote-game05-20261030
      - feature/dara-game04-20261030
      - refactor/safe-game-catalog-20261030
      - fix/four-character-room-code-websocket-20261019
      - fix/room-passwords
      - deploy/railway-shithead-games-staging
      - fix/w4-complete-match-20261019
      - build/w1-turn-seat-selector
      - fix/w3-test-contract-20261018
      - feature/w4-local-multiplayer-lobby-20261018
      - feature/w4-live-card-matches-20261018
  pull_request:
    branches:
      - feature/awale-third-game-20261030
      - fix/four-character-room-code-websocket-20261019
      - deploy/railway-shithead-games-staging
      - fix/preflight-multiplayer-20261019
      - build/w1-turn-seat-selector
      - fix/w3-test-contract-20261018
      - feature/w4-local-multiplayer-lobby-20261018
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q server/tests
      - run: python -m py_compile run_local.py
      - run: node --check server/app/static/client.js
      - run: node --check server/app/static/ludo.js
      - run: node --check server/app/static/awale.js
      - run: node --check server/app/static/dara.js
      - run: node --check server/app/static/yote.js
      - run: node --check server/app/static/dominoes.js
      - run: node --check server/app/static/owner.js
      - run: node --check server/app/static/owner-login.js
      - run: node --check server/app/static/solo-ludo.js
      - run: node --check server/app/static/solo-awale.js

name: Android PWA icon assets
on:
  push:
    branches:
      - feature/android-pwa-play-store-prep-20261031
    paths:
      - .github/workflows/android-pwa-icons.yml
      - tools/generate_pwa_icons.py
      - server/app/static/brand/shithead-logo.png
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    if: github.repository == 'sirafrica92-a11y/Shithead-'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resize original jester logo
        run: |
          python -m pip install Pillow==12.0.0
          python tools/generate_pwa_icons.py
      - name: Commit derived binary assets to the isolated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app/static/brand/shithead-logo-192.png server/app/static/brand/shithead-maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(android): add jester 192px and 512px maskable icons"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
